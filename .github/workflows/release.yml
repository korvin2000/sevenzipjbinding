name: Release

# Builds + tests every CI platform (ci.yml) from the tagged commit and publishes a GitHub release with
# the per-platform zips, SHA256SUMS.txt and the release notes. Also ships an AVX2-optimized Windows x64
# zip (Windows-amd64-avx2) built + tested by windows-x64-compilers.yml with the benchmark winner
# (bench-results.md); the portable Windows-amd64 zip stays the default. The Linux glibc zips incl. the
# AVX2 Linux-amd64-avx2 one come from ci.yml (linux-glibc.yml).
#
# How to cut a release (either way):
#   * Actions tab -> "Release" -> Run workflow -> enter a new tag (e.g. Release-26.03-2.4), tick
#     "pre-release" if wanted. The tag is created on the selected branch's head commit.
#   * or push a tag:  git tag Release-26.03-2.4 && git push origin Release-26.03-2.4
# The zips are named after SEVENZIPJBINDING_VERSON in CMakeLists.txt, so bump that first.
on:
  push:
    tags: ['Release-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. Release-26.03-2.4'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  # Runs AFTER ci.yml on purpose: ci.yml's "all platform zips" job downloads every artifact of the run,
  # and this build's package zip has the same file name as the portable Windows-amd64 zip.
  windows-x64-avx2:
    needs: build
    uses: ./.github/workflows/windows-x64-compilers.yml
    with:
      only: clang23-avx2-lto   # benchmark winner, see bench-results.md
      bench: false

  publish:
    name: publish GitHub release
    needs: [build, windows-x64-avx2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: all-platform-zips
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: bin-clang23-avx2-lto
          path: avx2

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
        run: |
          set -eux
          VERSION=$(sed -nE 's/^SET\(SEVENZIPJBINDING_VERSON ([^)]+)\)/\1/p' CMakeLists.txt)
          test -n "$VERSION"
          cp ReleaseNotes.txt "dist/ReleaseNotes-$VERSION.txt"
          cp "avx2/sevenzipjbinding-$VERSION-Windows-amd64.zip" "dist/sevenzipjbinding-$VERSION-Windows-amd64-avx2.zip"
          cp bench-results.md "dist/bench-results-$VERSION.md"
          AVX2_COMPILER=$(sed -n 's/^compiler: *//p' avx2/info.txt)
          AVX2_FLAGS=$(sed -n 's/^flags: *//p' avx2/info.txt)
          (cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            echo "7-Zip-JBinding $VERSION (7-Zip 26.03 engine), built and tested by GitHub Actions"
            echo "([run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}), commit ${GITHUB_SHA})."
            echo
            echo "Each \`sevenzipjbinding-$VERSION-<platform>.zip\` contains \`lib/sevenzipjbinding.jar\` (Java API, Java 8+)"
            echo "and \`lib/sevenzipjbinding-<platform>.jar\` (the native library for that platform) - put both on the classpath."
            echo
            echo "| Platform | Zip |"
            echo "|---|---|"
            echo "| Windows x64 | \`Windows-amd64\` |"
            echo "| Windows x64, AVX2-optimized (Haswell / Zen 1 or newer) | \`Windows-amd64-avx2\` |"
            echo "| Windows ARM64 | \`Windows-arm64\` |"
            echo "| Linux x64 (glibc 2.35+) | \`Linux-amd64\` |"
            echo "| Linux x64 (glibc 2.35+), AVX2-optimized (Haswell / Zen 1 or newer) | \`Linux-amd64-avx2\` |"
            echo "| Linux ARM64 (glibc 2.35+) | \`Linux-arm64\` |"
            echo "| Linux musl (Alpine) x64 | \`Linux-amd64-musl\` |"
            echo "| Linux musl (Alpine) ARM64 | \`Linux-arm64-musl\` |"
            echo "| macOS universal (Intel + Apple Silicon) | \`AllMac\` |"
            echo "| macOS Intel only | \`Mac-x86_64\` |"
            echo "| macOS Apple Silicon only | \`Mac-arm64\` |"
            echo "| FreeBSD x64 | \`FreeBSD-amd64\` |"
            echo
            echo "Not built by CI (yet): Windows x86, 32-bit ARM and the AllPlatforms/AllWindows bundles."
            echo
            echo "**\`Windows-amd64-avx2\`** is a drop-in replacement for \`Windows-amd64\` (same jar names) for x86-64-v3"
            echo "CPUs (AVX2/FMA/BMI2): \`$AVX2_FLAGS\`, $AVX2_COMPILER, cross-built and"
            echo "tested with the full JUnit suite on Windows x64. On CPUs without AVX2 it fails with an illegal"
            echo "instruction - use \`Windows-amd64\` there. GCC 16.2/17 vs Clang 23.1/24 benchmark:"
            echo "\`bench-results-$VERSION.md\`."
            echo
            echo "**\`Linux-amd64-avx2\`** is the same drop-in replacement for \`Linux-amd64\`: \`-O3 -march=x86-64-v3 -ffast-math -flto\`,"
            echo "Clang 23 (apt.llvm.org), built and tested with the full JUnit suite natively on Ubuntu 22.04 x64."
            echo "The Linux glibc libs (Clang 23, \`-O3 -flto\`) link libgcc/libstdc++ statically and need only glibc 2.35+."
          } > notes.md
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt "dist/ReleaseNotes-$VERSION.txt" \
            "dist/bench-results-$VERSION.md" \
            --target "$GITHUB_SHA" --title "7-Zip-JBinding $VERSION ($TAG)" --notes-file notes.md $PRERELEASE
